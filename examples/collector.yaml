receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlphttp/local:
    endpoint: http://127.0.0.1:4320
    sending_queue:
      enabled: true
      queue_size: 2048
      num_consumers: 2

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/local]
