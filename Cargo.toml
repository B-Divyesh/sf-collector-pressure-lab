[package]
name = "collector-pressure-lab"
version = "0.1.0"
edition = "2024"
description = "Bounded local pressure experiments for OpenTelemetry Collector configurations"
license = "MIT"
readme = "README.md"
repository = "https://github.com/B-Divyesh/sf-collector-pressure-lab"
keywords = ["opentelemetry", "collector", "load-testing", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "/src/**",
  "/tests/**",
  "/examples/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[[bin]]
name = "cplab"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"

[dev-dependencies]
tempfile = "3.21.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
